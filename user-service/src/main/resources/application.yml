  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:muyapp2020@gmail.com}
    password: "nirt vyud gumb hkwo"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 10000

server:
  port: 8081

management:
  endpoints:
    web:
