spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/emprendia
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

storage:
  type: local
  local:
    path: ./uploads
    base-url: http://localhost:8084/api/files

